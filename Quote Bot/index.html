<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Quote Widget</title>
  <style>
    /* Notion公式風のカラー変数定義 */
    :root {
      --bg-color: #ffffff;
      --text-color: rgba(55, 53, 47, 0.85);
      --sub-color: rgba(55, 53, 47, 0.45);
      --border-color: rgba(55, 53, 47, 0.12);
      --btn-hover: rgba(55, 53, 47, 0.08);
    }

    /* Notionダークモード対応 */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #191919;
        --text-color: rgba(255, 255, 255, 0.81);
        --sub-color: rgba(255, 255, 255, 0.45);
        --border-color: rgba(255, 255, 255, 0.13);
        --btn-hover: rgba(255, 255, 255, 0.1);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: transparent;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 8px;
    }

    /* Notion風のカードデザイン */
    .card {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px 20px;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .quote-text {
      font-size: 0.92rem;
      line-height: 1.6;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .quote-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .author {
      font-size: 0.78rem;
      color: var(--sub-color);
    }

    .refresh-btn {
      background: none;
      border: none;
      color: var(--sub-color);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background-color 0.2s, color 0.2s;
    }

    .refresh-btn:hover {
      background-color: var(--btn-hover);
      color: var(--text-color);
    }

    .refresh-btn svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="quote-text" id="quote"></div>
    <div class="quote-footer">
      <span class="author" id="author"></span>
      <button class="refresh-btn" onclick="nextQuote()">
        <svg viewBox="0 0 16 16">
          <path d="M13.65 2.35A7.958 7.958 0 0 0 8 0C3.58 0 0 3.58 0 8s3.58 8 8 8c3.84 0 7.08-2.71 7.85-6.33h-2.07A5.992 5.992 0 0 1 8 14c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L9 7h7V0l-2.35 2.35z"/>
        </svg>
        次へ
      </button>
    </div>
  </div>

  <script>
    // お好みの名言をここに追加・編集できます
    const quotes = [
      { text: "成功とは、失敗から失敗へと熱意を失わずに進むことである。", author: "ウィンストン・チャーチル" },
      { text: "未来を予測する最良の方法は、それを発明することだ。", author: "アラン・ケイ" },
      { text: "小さなことを積み重ねることが、とんでもないところへ行く唯一の道。", author: "イチロー" },
      { text: "思考が変われば、言葉が変わる。言葉が変われば、行動が変わる。", author: "マザー・テレサ" },
      { text: "シンプルであることは、究極の洗練である。", author: "レオナルド・ダ・ヴィンチ" },
      { text: "今日という日は、残りの人生の最初の一日である。", author: "チャールズ・ディードリッヒ" },
      { text: "自分自身になれ。他の誰かはすでに取られている。", author: "オスカー・ワイルド" }
    ];

    let current = -1;

    function nextQuote() {
      let next;
      do {
        next = Math.floor(Math.random() * quotes.length);
      } while (next === current && quotes.length > 1);
      
      current = next;
      const q = quotes[current];
      
      document.getElementById('quote').textContent = `「${q.text}」`;
      document.getElementById('author').textContent = `— ${q.author}`;
    }

    nextQuote();
  </script>

</body>
</html>
